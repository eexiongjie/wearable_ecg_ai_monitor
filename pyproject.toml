[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-ai-monitor"
version = "0.1.0"
description = "Wearable single-lead ECG AI monitoring and arrhythmia screening demo"
requires-python = ">=3.10"
authors = [{name = "Your Name"}]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ecg-monitor = "ecg_ai_monitor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
